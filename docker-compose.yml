# PathScore Docker Compose Configuration
#
# Usage:
#   Without Celery (threads mode):
#     docker compose up -d mysql flask
#
#   With Celery:
#     docker compose --profile celery up -d
#
#   Clean up (including volumes):
#     docker compose down -v

services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    image: pathscore-mysql:8.2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pathscore_root}
      MYSQL_DATABASE: refs
      MYSQL_USER: ${MYSQL_USER:-www}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pathscore_dev}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-pathscore_root}"]
      timeout: 10s
      retries: 10
      interval: 5s
      start_period: 30s

  redis:
    image: redis:7-alpine
    profiles: ["celery"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      interval: 3s

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    image: pathscore-flask:3.12
    ports:
      - "${FLASK_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLASK_CONFIG: ${FLASK_CONFIG:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      PARALLEL_MODE: ${PARALLEL_MODE:-threads}

      # Database
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-www}:${MYSQL_PASSWORD:-pathscore_dev}@mysql:3306/pway
      DEV_DATABASE_URL: mysql+pymysql://${MYSQL_USER:-www}:${MYSQL_PASSWORD:-pathscore_dev}@mysql:3306/pway
      MYSQLDB_HOST: mysql
      MYSQLDB_DB: pway
      SQLALCHEMY_POOL_RECYCLE: 3600

      # Celery (used when PARALLEL_MODE=celery)
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Application paths
      DATA_ROOT: /data
      TEMP_FOLDER: /data/temp
      LOG_PATH: /data/logs/pathscore.log
      MPLCONFIGDIR: /data/.matplotlib

      # Security
      SECURITY_PASSWORD_HASH: bcrypt
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT:-change-me-in-production}
      SECURITY_CONFIRMABLE: ${SECURITY_CONFIRMABLE:-False}
      SECURITY_REGISTERABLE: ${SECURITY_REGISTERABLE:-True}
      SECURITY_CHANGEABLE: ${SECURITY_CHANGEABLE:-True}

      # Mail (optional)
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SENDER: ${MAIL_SENDER:-noreply@localhost}
      MAIL_DEFAULT_SENDER: ${MAIL_SENDER:-noreply@localhost}

      # Local mode (future feature)
      LOCAL_MODE: ${LOCAL_MODE:-false}
    volumes:
      - app_data:/data
      - ./app:/app/app:ro  # Mount source for development
    command: ["gunicorn", "-b", "0.0.0.0:5000", "-w", "2", "--timeout", "120", "pathscore:app"]

  flask-dev:
    # Development variant with Flask's built-in server and hot reload
    build:
      context: .
      dockerfile: Dockerfile
    image: pathscore-flask:3.12
    profiles: ["dev"]
    ports:
      - "${FLASK_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLASK_CONFIG: development
      FLASK_DEBUG: "1"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      PARALLEL_MODE: ${PARALLEL_MODE:-threads}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-www}:${MYSQL_PASSWORD:-pathscore_dev}@mysql:3306/pway
      DEV_DATABASE_URL: mysql+pymysql://${MYSQL_USER:-www}:${MYSQL_PASSWORD:-pathscore_dev}@mysql:3306/pway
      MYSQLDB_HOST: mysql
      MYSQLDB_DB: pway
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATA_ROOT: /data
      TEMP_FOLDER: /data/temp
      LOG_PATH: /data/logs/pathscore.log
      MPLCONFIGDIR: /data/.matplotlib
      SECURITY_PASSWORD_HASH: bcrypt
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT:-dev-salt}
      SECURITY_CONFIRMABLE: "False"
      SECURITY_REGISTERABLE: "True"
      LOCAL_MODE: ${LOCAL_MODE:-false}
    volumes:
      - app_data:/data
      - ./app:/app/app  # Writable mount for development
      - ./pathscore.py:/app/pathscore.py
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000", "--reload"]

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: pathscore-flask:3.12
    profiles: ["celery"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_CONFIG: ${FLASK_CONFIG:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      PARALLEL_MODE: celery
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-www}:${MYSQL_PASSWORD:-pathscore_dev}@mysql:3306/pway
      MYSQLDB_HOST: mysql
      MYSQLDB_DB: pway
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATA_ROOT: /data
      TEMP_FOLDER: /data/temp
      LOG_PATH: /data/logs/celery.log
      MPLCONFIGDIR: /data/.matplotlib
      SECURITY_PASSWORD_HASH: bcrypt
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT:-change-me-in-production}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SENDER: ${MAIL_SENDER:-noreply@localhost}
    volumes:
      - app_data:/data
    command: >
      celery -A pathscore.celery worker
      --loglevel=INFO
      --queues=default,analysis,mail
      --concurrency=2

volumes:
  mysql_data:
  redis_data:
  app_data:
